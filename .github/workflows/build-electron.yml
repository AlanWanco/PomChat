name: Build Electron Apps

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macos-arm64
            runner: macos-14
            build_args: --mac dmg --arm64
            artifact_glob: release/*.dmg
            artifact_name: macos-arm64-installer
          - name: windows-x64
            runner: windows-latest
            build_args: --win nsis --x64
            artifact_glob: release/*.exe
            artifact_name: windows-x64-installer
          - name: windows-arm64
            runner: windows-latest
            build_args: --win nsis --arm64
            artifact_glob: release/*.exe
            artifact_name: windows-arm64-installer
          - name: linux-x64
            runner: ubuntu-24.04
            build_args: --linux dir --x64
            artifact_glob: release/**
            artifact_name: linux-x64-unpacked
          - name: linux-arm64
            runner: ubuntu-24.04
            build_args: --linux dir --arm64
            artifact_glob: release/**
            artifact_name: linux-arm64-unpacked

    runs-on: ${{ matrix.runner }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Linux packaging dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libarchive-tools

      - name: Install dependencies
        run: npm ci

      - name: Build renderer and Electron bundles
        run: npm run build

      - name: Prepare offline Remotion browser
        run: npm run prepare-remotion-offline

      - name: Package Electron app
        shell: bash
        run: |
          # Retry transient download/DNS failures only; keep real build errors visible.
          for attempt in 1 2 3; do
            log_file="${RUNNER_TEMP}/electron-builder-${attempt}.log"
            if npx electron-builder ${{ matrix.build_args }} --publish never >"$log_file" 2>&1; then
              cat "$log_file"
              exit 0
            else
              status=$?
            fi
            cat "$log_file"
            if [ "$attempt" -eq 3 ] || ! grep -Eq 'ENOTFOUND|EAI_AGAIN|ECONNRESET|ETIMEDOUT|socket hang up' "$log_file"; then
              exit "$status"
            fi
            echo "::warning::Transient network failure; retrying packaging (attempt $((attempt + 1))/3)."
            sleep $((attempt * 20))
          done

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_glob }}
          if-no-files-found: error
